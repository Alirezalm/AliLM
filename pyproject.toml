[project]
name = "alilm"
version = "0.1.0"
description = "My Personal Transformer Language Model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "jaxtyping>=0.3.10",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "regex>=2026.5.9",
    "torch>=2.11.0",
    "transformers>=5.9.0",
]

[dependency-groups]
dev = [
    "line-profiler>=5.0.2",
    "notebook>=7.5.6",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
triton = { index = "pytorch-cu126" }